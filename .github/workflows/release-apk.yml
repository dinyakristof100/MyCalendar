name: Release APK

# Push-ra (app-változás a main-en) magától buildel egy release APK-t es feltolti
# GitHub Release-be 'mycalendar.apk' neven. A weboldal gombja a
# releases/latest/download/mycalendar.apk linkre mutat -> mindig ezt tolti.
on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:        # kézi indítás az Actions fülről (teszteléshez)

permissions:
  contents: write           # release + tag létrehozásához kell

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'   # a helyi géped verziója, pinnelve
          channel: stable
          cache: true

      # A telefonoddal AZONOS debug kulcs visszaállítása a secretből egy explicit
      # fájlba, amit a gradle a RELEASE_KEYSTORE env-en át HASZNÁL (nem az AGP
      # implicit ~/.android helyére hagyatkozunk — az a CI-n más kulcsot adott).
      # Ugyanaz a kulcs -> felül-telepítés megy + a Firebase SHA-1 stimmel.
      - name: Release keystore a secretből
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Hiányzik a DEBUG_KEYSTORE_B64 secret. Add hozzá: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # versionName a pubspec-ből, versionCode a futásszámból (>3, monoton nő).
      - name: Verzió számítása
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          echo "VNAME=$NAME" >> "$GITHUB_ENV"
          echo "VC=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name="$VNAME" --build-number="$VC"

      # Őr: a release erőforrás-zsugorítója egyszer már kidobta a csak Dartból
      # hivatkozott ic_notification drawable-t -> az APK induláskor elszállt
      # (invalid_icon), miközben minden debug build jó volt. A keep.xml védi
      # (android/app/src/main/res/raw/keep.xml), ez a lépés pedig garantálja,
      # hogy ilyen APK többé NEM jelenhet meg release-ként. Ide vegyél fel
      # minden újabb, csak futásidőben hivatkozott erőforrást.
      - name: APK-őr — kötelező erőforrások és verzió
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 | sort -V | tail -1)
          if ! "$AAPT2" dump resources "$APK" | grep -q "drawable/ic_notification"; then
            echo "::error::ic_notification hiányzik a release APK-ból (erőforrás-zsugorító!) — lásd res/raw/keep.xml. Nem adunk ki törött release-t."
            exit 1
          fi
          if ! "$AAPT2" dump badging "$APK" | grep -q "versionName='$VNAME'"; then
            echo "::error::A release APK versionName-je nem '$VNAME'."
            exit 1
          fi
          echo "APK-őr OK: ic_notification benne van, versionName=$VNAME."

      # Ellenőrzés a logban: melyik kulccsal írtunk alá. A helyi/Firebase kulcs
      # SHA-1-e: 0e:51:60:20:9c:e1:9b:38:2d:28:5b:f9:f2:7f:88:05:d8:87:8a:02
      - name: Aláíró kulcs a logba
        run: |
          AS=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$AS" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-1" || true

      - name: APK átnevezése (állandó név a stabil linkhez)
        run: cp build/app/outputs/flutter-apk/app-release.apk mycalendar.apk

      - name: Release közzététele
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}+${{ env.VC }}
          name: v${{ env.VNAME }}+${{ env.VC }}
          files: mycalendar.apk
          fail_on_unmatched_files: true
